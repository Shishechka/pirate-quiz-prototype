name: Build debug APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - name: Install Android SDK 35
        run: |
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platform-tools" "platforms;android-35" "build-tools;35.0.0"
      - name: Package Android signing tools
        run: |
          mkdir -p ci-apksigner/lib
          cp "$ANDROID_HOME/build-tools/35.0.0/apksigner" ci-apksigner/
          cp "$ANDROID_HOME/build-tools/35.0.0/zipalign" ci-apksigner/
          cp "$ANDROID_HOME/build-tools/35.0.0/lib/apksigner.jar" ci-apksigner/lib/
      - uses: actions/upload-artifact@v4
        with:
          name: android-apksigner-35
          path: ci-apksigner
      - name: Unpack game art
        run: |
          mkdir -p app/src/main/assets/art
          unzip -o art-assets.zip -d app/src/main/assets/art
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Build APK
        run: gradle :app:assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: pirate-quiz-v0.1-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
