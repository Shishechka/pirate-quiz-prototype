name: Build Pirates no-flagship lab

on:
  workflow_dispatch:
  push:
    branches: [ main, no-flagship-lab ]

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android SDK 35
        run: |
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Restore stable Pirates signing key
        run: |
          mkdir -p ci
          base64 -d ci/pirates-v1.keystore.b64 > ci/pirates-v1.keystore
          keytool -list -keystore ci/pirates-v1.keystore -storepass piratesv1 -alias piratesdebug >/dev/null

      - name: Pirates no-flagship source sanity
        run: |
          python3 - <<'PY'
          from pathlib import Path
          game=Path("app/src/main/assets/game.js").read_text()
          ui=Path("app/src/main/assets/ui_patch.js").read_text()
          index=Path("app/src/main/assets/index.html").read_text()
          visual=Path("app/src/main/assets/v3_visual_patch.js").read_text()
          noflag=Path("app/src/main/assets/no_flagship_mode.js").read_text()
          assert "for(let i=1;i<=36;i++)" in game
          assert "Array.from({length:8}" in ui
          assert "for(var r=0;r<8;r++)" in ui
          assert "S.orders[r].forEach" in ui
          assert "contentBounds()" in ui and "usableRect()" in ui
          assert "v3_visual_patch.js" in index
          assert "v1_1_visual_patch.js" not in index
          assert "no_flagship_mode.js" in index
          assert "balance_test_patch.js" not in index
          assert "phase:'CLAIM'" in noflag
          assert "Ship gameplay disabled" in noflag
          assert "--island-sprite" in ui
          assert "__PIRATES_MANUAL_BOOT__" in index
          assert "questionTimerFill" in index
          assert "QUESTION_MS=20000" in noflag
          print("Pirates no-flagship source sanity: OK")
          PY

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Clean Gradle build
        run: gradle clean :app:assembleDebug

      - name: Verify APK package, version, alignment and signature
        run: |
          APK="app/build/outputs/apk/debug/app-debug.apk"
          "$ANDROID_HOME/build-tools/35.0.0/zipalign" -c -v 4 "$APK"
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose --print-certs "$APK"
          BADGING=$("$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging "$APK")
          echo "$BADGING" | grep "package: name='com.piratequiz.prototype'"
          echo "$BADGING" | grep "versionCode='2'"
          echo "$BADGING" | grep "versionName='1.1.0'"
          cp "$APK" "Pirates-no-flagship-lab.apk"

      - uses: actions/upload-artifact@v4
        with:
          name: Pirates-no-flagship-lab
          path: Pirates-no-flagship-lab.apk
