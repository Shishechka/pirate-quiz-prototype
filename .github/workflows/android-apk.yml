name: Build Pirates no-flagship lab

on:
  workflow_dispatch:
  push:
    branches: [ 1.2.2 ]

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android SDK 35
        run: |
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Restore stable Pirates signing key
        run: |
          mkdir -p ci
          base64 -d ci/pirates-v1.keystore.b64 > ci/pirates-v1.keystore
          keytool -list -keystore ci/pirates-v1.keystore -storepass piratesv1 -alias piratesdebug >/dev/null

      - name: Materialize approved Art Pack 1.0
        run: |
          mkdir -p app/src/main/assets/art
          cat app/src/main/assets/art-src/map/map_*.b64 | tr -d '\n\r' | base64 -d > app/src/main/assets/art/approved_map_v1.webp
          cat app/src/main/assets/art-src/atlas/atlas_*.b64 | tr -d '\n\r' | base64 -d > app/src/main/assets/art/approved_assets_atlas_v1.webp
          echo "6390f8c4868403590fb9206dae80fd61a7acd8af0c4b5dd9e721adac22906512  app/src/main/assets/art/approved_map_v1.webp" | sha256sum -c -
          echo "7c2c52440e8afa202ac78324f9b410409c941bf984096dd823640597af2889cf  app/src/main/assets/art/approved_assets_atlas_v1.webp" | sha256sum -c -
          test $(stat -c%s app/src/main/assets/art/approved_map_v1.webp) -eq 867412
          test $(stat -c%s app/src/main/assets/art/approved_assets_atlas_v1.webp) -eq 538756

          # Materialize all four locked/approved bases; their sources are NOT runtime image URLs.
          for base in base_A_red base_B_blue base_C_green base_D_purple; do
            cat "app/src/main/assets/art-src/approved-bases-v1/$base"/part_*.b64 | tr -d '\n\r' | base64 -d > "app/src/main/assets/art/$base.webp"
          done
          echo "60f30305792ebe2d3e86301d0000c9c077d9e608c6dca3ab65e1290dc3775163  app/src/main/assets/art/base_A_red.webp" | sha256sum -c -
          echo "752f14a61c5025f9138ed0d8dc9146e4dd01027e9ca3172b9c89e89b8f10f0e9  app/src/main/assets/art/base_B_blue.webp" | sha256sum -c -
          echo "b2c1841d4ccf0e2295883b1667ae06a82a55e83e5a771d9b1d2651195b5a7cda  app/src/main/assets/art/base_C_green.webp" | sha256sum -c -
          echo "709a92c1d2204ff6b1dc45c1ace11b832f5ac2e729412188414da46d80bc2de6  app/src/main/assets/art/base_D_purple.webp" | sha256sum -c -

      - name: No-flagship runtime sanity
        run: |
          python3 - <<'PY'
          from pathlib import Path
          index=Path("app/src/main/assets/index.html").read_text()
          game=Path("app/src/main/assets/no_flagship_game.js").read_text()
          ui=Path("app/src/main/assets/no_flagship_ui.js").read_text()
          art=Path("app/src/main/assets/no_flagship_art.js").read_text()
          assert 'src="game.js"' not in index
          assert 'src="ui_patch.js"' not in index
          assert 'src="no_flagship_game.js"' in index
          assert 'game_map_part1.js' not in index and 'game_map_part2.js' not in index and 'game_map_part3.js' not in index
          assert 'src="no_flagship_art.js"' in index
          assert 'src="no_flagship_ui.js"' in index
          assert "ship:" not in game
          assert "Флагман" not in game
          assert "phase:'CLAIM'" in game
          assert "const MAP_SCHEMA_VERSION='1.0'" in game
          assert "const L2=new Set([3,8,9,11,17,18,19,20,26,28,29,34])" in game
          assert "const L3=new Set([10,14,15,16,21,22,23,27])" in game
          assert "A:[1,7,13]" in game and "B:[6,12,18]" in game
          assert "C:[25,31,32]" in game and "D:[30,35,36]" in game
          assert "[2,7],[5,10],[15,22],[16,21],[16,23],[17,22],[25,32],[26,31],[29,34]" in game
          assert Path("docs/map-schema-v1.0.md").exists()
          assert Path("docs/approved-art-assets-v1.md").exists()
          assert "botVsBotMcq" in game and "BOT_THINK_MIN" in game
          assert "baseVisualOwner" in game
          assert "defenseFame" in game and "+1 слава за защиту" in game
          assert "HUMAN_QUESTION_MS=20000" in game
          assert "ANSWER_REVEAL_MS=3000" in game
          assert "correctReveal" in game and "attackerFull" in game and "defenderFull" in game and "samePick" in game
          assert "orderMark" in game and "claimOrders" in game
          assert "S.orders" in game
          assert "showNumericReveal" in game and "NUMERIC_REORDER_DELAY" in game
          assert "setupGestures" in ui
          assert "right:92px" in ui and "orderMark" in ui
          assert "renderStandings" in game
          assert "standingsRows" in index
          assert '.actionBtn{display:none!important}' in index
          assert "Math.max(u.width/1600,u.height/900)" in ui
          assert 'src="approved_corner_bases.js"' in index
          bases=Path("app/src/main/assets/approved_corner_bases.js").read_text()
          assert all(name in bases for name in ("base_A_red.webp","base_B_blue.webp","base_C_green.webp","base_D_purple.webp"))
          assert all(Path("app/src/main/assets/art/"+name).exists() for name in ("base_A_red.webp","base_B_blue.webp","base_C_green.webp","base_D_purple.webp"))
          assert "Approved Art Pack 1.0" in art
          assert 'art/approved_map_v1.webp' in art
          assert "#routeSvg{display:none" in art
          assert ".tile:before,.tile:after,.base:before,.base:after" in art
          assert "fitPirateMap" in ui
          assert "const colX=[300,500,700,900,1100,1300],rowY=[170,290,410,530,650,770]" in ui
          assert "A:{x:150,y:145}" in ui and "D:{x:1450,y:755}" in ui
          assert Path("app/src/main/assets/art/approved_map_v1.webp").exists()
          assert Path("app/src/main/assets/art/approved_assets_atlas_v1.webp").exists()
          print("No-flagship Art Pack 1.0 sanity: OK")
          PY

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Clean Gradle build
        run: gradle clean :app:assembleDebug

      - name: Verify APK
        run: |
          APK="app/build/outputs/apk/debug/app-debug.apk"
          "$ANDROID_HOME/build-tools/35.0.0/zipalign" -c -v 4 "$APK"
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose --print-certs "$APK"
          BADGING=$("$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging "$APK")
          echo "$BADGING" | grep "package: name='com.piratequiz.prototype'"
          cp "$APK" "Pirates-1.2.2.apk"

      - uses: actions/upload-artifact@v4
        with:
          name: Pirates-1.2.2
          path: Pirates-1.2.2.apk
