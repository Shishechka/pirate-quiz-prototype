name: Build Pirates Rules v0.4 APK

on:
  workflow_dispatch:
  push:
    branches: [ main, core/v0.2 ]

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Run Core v0.2 tests
        run: node --test app/src/main/assets/core/tests/*.test.js

      - name: Rules v0.4 runtime source sanity
        run: |
          node --check app/src/main/assets/runtime_v0_4.js
          python3 - <<'PY'
          from pathlib import Path
          index = Path("app/src/main/assets/index.html").read_text()
          runtime = Path("app/src/main/assets/runtime_v0_4.js").read_text()
          activity = Path("app/src/main/java/com/piratequiz/prototype/MainActivity.java").read_text()

          assert 'type="module" src="runtime_v0_4.js"' in index
          assert '<script src="game.js">' not in index
          assert '<script src="ui_patch.js">' not in index
          assert 'createCoreGame' in runtime
          assert "RULES_VERSION" in runtime
          assert "GAME_STAGES.ARCHIPELAGO" in runtime
          assert "GAME_STAGES.PREPARATION" in runtime
          assert "GAME_STAGES.WAR" in runtime
          assert "previewActiveQuestionOutcome" in runtime
          assert "commitActiveQuestionResult" in runtime
          assert "humanPhase = 'READY_TO_START'" in runtime
          assert "▶ Начать освоение" in runtime
          assert "setTimeout(() => {\n    if (game.state.stage === GAME_STAGES.ARCHIPELAGO) {\n      startArchipelagoQuestion();" not in runtime
          assert "https://" in activity and "appassets.local" in activity
          assert "shouldInterceptRequest" in activity
          print("Rules v0.4 runtime sanity: OK")
          PY

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android SDK 35
        run: |
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Restore stable Pirates signing key
        run: |
          mkdir -p ci
          base64 -d ci/pirates-v1.keystore.b64 > ci/pirates-v1.keystore
          keytool -list -keystore ci/pirates-v1.keystore -storepass piratesv1 -alias piratesdebug >/dev/null

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Clean Gradle build
        run: gradle clean :app:assembleDebug

      - name: Verify APK package, version, alignment and signature
        run: |
          APK="app/build/outputs/apk/debug/app-debug.apk"
          "$ANDROID_HOME/build-tools/35.0.0/zipalign" -c -v 4 "$APK"
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose --print-certs "$APK"
          BADGING=$("$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging "$APK")
          echo "$BADGING" | grep "package: name='com.piratequiz.prototype'"
          cp "$APK" "Pirates-Rules-v0.4-Core-v0.2.apk"

      - uses: actions/upload-artifact@v4
        with:
          name: Pirates-Rules-v0.4-Core-v0.2
          path: Pirates-Rules-v0.4-Core-v0.2.apk
