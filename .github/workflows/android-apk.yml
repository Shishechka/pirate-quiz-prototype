name: Build Pirates no-flagship lab

on:
  workflow_dispatch:
  push:
    branches: [ no-flagship-lab ]

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android SDK 35
        run: |
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Restore stable Pirates signing key
        run: |
          mkdir -p ci
          base64 -d ci/pirates-v1.keystore.b64 > ci/pirates-v1.keystore
          keytool -list -keystore ci/pirates-v1.keystore -storepass piratesv1 -alias piratesdebug >/dev/null

      - name: No-flagship runtime sanity
        run: |
          python3 - <<'PY'
          from pathlib import Path
          index=Path("app/src/main/assets/index.html").read_text()
          game=Path("app/src/main/assets/no_flagship_game.js").read_text()
          ui=Path("app/src/main/assets/no_flagship_ui.js").read_text()
          art=Path("app/src/main/assets/no_flagship_art.js").read_text()
          assert 'src="game.js"' not in index
          assert 'src="ui_patch.js"' not in index
          assert 'src="no_flagship_game.js"' in index
          assert 'src="no_flagship_art.js"' in index
          assert 'src="v1_1_visual_patch.js"' not in index
          assert 'src="no_flagship_ui.js"' in index
          assert "ship:" not in game
          assert "Флагман" not in game
          assert "phase:'CLAIM'" in game
          assert "botVsBotMcq" in game and "BOT_THINK_MIN" in game
          assert "baseVisualOwner" in game
          assert "defenseFame" in game and "+1 слава за защиту" in game
          assert "HUMAN_QUESTION_MS=20000" in game
          assert "ANSWER_REVEAL_MS=3000" in game
          assert "correctReveal" in game and "attackerFull" in game and "defenderFull" in game and "samePick" in game
          assert "orderMark" in game and "claimOrders" in game
          assert "S.orders" in game
          assert "showNumericReveal" in game and "NUMERIC_REORDER_DELAY" in game
          assert "setupGestures" in ui
          assert "right:92px" in ui and "orderMark" in ui
          assert "renderStandings" in game
          assert "standingsRows" in index
          assert '.actionBtn{display:none!important}' in index
          assert "Math.max(u.width/1600,u.height/900)*.96" in ui
          assert Path("docs/no-flagship-ui-spec.md").exists()
          assert "ARTS={" in art
          assert "data:image/webp;base64" in art
          assert "--pirates-map" in art
          assert "fitPirateMap" in ui
          assert "A:{x:185,y:145}" in ui and "C:{x:185,y:755}" in ui
          print("No-flagship clean runtime sanity: OK")
          PY

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Clean Gradle build
        run: gradle clean :app:assembleDebug

      - name: Verify APK
        run: |
          APK="app/build/outputs/apk/debug/app-debug.apk"
          "$ANDROID_HOME/build-tools/35.0.0/zipalign" -c -v 4 "$APK"
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose --print-certs "$APK"
          BADGING=$("$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging "$APK")
          echo "$BADGING" | grep "package: name='com.piratequiz.prototype'"
          cp "$APK" "Pirates-no-flagship-refactor.apk"

      - uses: actions/upload-artifact@v4
        with:
          name: Pirates-no-flagship-refactor
          path: Pirates-no-flagship-refactor.apk
