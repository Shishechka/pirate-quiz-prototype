name: Build Pirates no-flagship lab

on:
  workflow_dispatch:
  push:
    branches: [ no-flagship-lab ]

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android SDK 35
        run: |
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Restore stable Pirates signing key
        run: |
          mkdir -p ci
          base64 -d ci/pirates-v1.keystore.b64 > ci/pirates-v1.keystore
          keytool -list -keystore ci/pirates-v1.keystore -storepass piratesv1 -alias piratesdebug >/dev/null

      - name: Materialize approved Art Pack 1.1
        run: |
          mkdir -p app/src/main/assets/art
          cat app/src/main/assets/art-src/map-v1_1/map_*.b64 | tr -d '\n\r' | base64 -d > app/src/main/assets/art/approved_map_v1_1.webp
          cat app/src/main/assets/art-src/baseA-v1_1/baseA_*.b64 | tr -d '\n\r' | base64 -d > app/src/main/assets/art/base_A_red_v1_1.webp
          cat app/src/main/assets/art-src/atlas/atlas_*.b64 | tr -d '\n\r' | base64 -d > app/src/main/assets/art/approved_assets_atlas_v1.webp
          echo "f2c96d9eb7f4b95a53d87b3410ec3353af41f0bb57fc86ad80f4920275e7b39a  app/src/main/assets/art/approved_map_v1_1.webp" | sha256sum -c -
          echo "6273a3e3bf9400f26dcdb2f61bd9109085d4c547fdb2d0625cee4f2448444fcf  app/src/main/assets/art/base_A_red_v1_1.webp" | sha256sum -c -
          echo "7c2c52440e8afa202ac78324f9b410409c941bf984096dd823640597af2889cf  app/src/main/assets/art/approved_assets_atlas_v1.webp" | sha256sum -c -
          test $(stat -c%s app/src/main/assets/art/approved_map_v1_1.webp) -eq 1523324
          test $(stat -c%s app/src/main/assets/art/base_A_red_v1_1.webp) -eq 326066

      - name: No-flagship runtime sanity
        run: |
          python3 - <<'PY'
          from pathlib import Path
          index=Path("app/src/main/assets/index.html").read_text()
          game=Path("app/src/main/assets/no_flagship_game.js").read_text()
          ui=Path("app/src/main/assets/no_flagship_ui.js").read_text()
          art=Path("app/src/main/assets/no_flagship_art.js").read_text()
          assert 'src="game.js"' not in index
          assert 'src="ui_patch.js"' not in index
          assert 'src="no_flagship_game.js"' in index
          assert 'src="no_flagship_art.js"' in index
          assert 'src="no_flagship_ui.js"' in index
          assert "ship:" not in game and "Флагман" not in game
          assert "phase:'CLAIM'" in game
          assert "const MAP_SCHEMA_VERSION='1.0'" in game
          assert "const L2=new Set([3,8,9,11,17,18,19,20,26,28,29,34])" in game
          assert "const L3=new Set([10,14,15,16,21,22,23,27])" in game
          assert "A:[1,7,13]" in game and "B:[6,12,18]" in game
          assert "C:[25,31,32]" in game and "D:[30,35,36]" in game
          assert Path("docs/map-schema-v1.0.md").exists()
          assert Path("docs/approved-art-assets-v1.1.md").exists()
          assert "botVsBotMcq" in game and "BOT_THINK_MIN" in game
          assert "defenseFame" in game and "+1 слава за защиту" in game
          assert "HUMAN_QUESTION_MS=20000" in game and "ANSWER_REVEAL_MS=3000" in game
          assert "correctReveal" in game and "samePick" in game
          assert "S.orders" in game and "showNumericReveal" in game
          assert "renderStandings" in game and "standingsRows" in index
          assert "setupGestures" in ui and "fitPirateMap" in ui
          assert "const colX=[300,500,700,900,1100,1300],rowY=[170,290,410,530,650,770]" in ui
          assert "A:{x:150,y:145}" in ui and "D:{x:1450,y:755}" in ui
          assert "Math.max(u.width/1600,u.height/900)*1.01" in ui
          assert "left:22%" in ui and "right:22%" in ui
          assert "Approved Art Pack 1.1" in art
          assert 'art/approved_map_v1_1.webp' in art
          assert "#routeSvg{display:none" in art
          assert "width:238px" in index and "backdrop-filter:blur(4px)" in index
          assert Path("app/src/main/assets/art/approved_map_v1_1.webp").exists()
          assert Path("app/src/main/assets/art/base_A_red_v1_1.webp").exists()
          print("Schema 1.0 / Art Pack 1.1 runtime sanity: OK")
          PY

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Clean Gradle build
        run: gradle clean :app:assembleDebug

      - name: Verify APK
        run: |
          APK="app/build/outputs/apk/debug/app-debug.apk"
          "$ANDROID_HOME/build-tools/35.0.0/zipalign" -c -v 4 "$APK"
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose --print-certs "$APK"
          BADGING=$("$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging "$APK")
          echo "$BADGING" | grep "package: name='com.piratequiz.prototype'"
          cp "$APK" "Pirates-schema-1.0-art-v1.1.apk"

      - uses: actions/upload-artifact@v4
        with:
          name: Pirates-schema-1.0-art-v1.1
          path: Pirates-schema-1.0-art-v1.1.apk
