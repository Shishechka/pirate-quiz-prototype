<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<title>Pirate Quiz Prototype</title>
<style>
:root{--r:#e24a42;--b:#3d80e7;--g:#3aaa68;--p:#9b57d3;--ink:#2d2115;--gold:#d4a443}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#1b1008;font-family:Georgia,"Times New Roman",serif}
button,input{font:inherit}
#app{position:relative;width:100%;height:100%;overflow:hidden;background:#2b190e}
.mapViewport{position:absolute;inset:0;overflow:hidden;touch-action:none;user-select:none}
.mapScene{position:absolute;left:0;top:0;width:1600px;height:900px;transform-origin:0 0;background:
radial-gradient(circle at 52% 46%,rgba(242,220,171,.32),rgba(157,111,62,.06) 50%,rgba(45,24,12,.18) 78%),
repeating-linear-gradient(8deg,rgba(90,54,26,.035) 0 1px,transparent 1px 8px),
linear-gradient(#d9b97b,#c89e5d);box-shadow:inset 0 0 100px #4c2a15aa}
.mapScene:before{content:"";position:absolute;inset:28px;border:2px solid #74513055;border-radius:28px;pointer-events:none}
.mapDecor{position:absolute;color:#6d4a2e;opacity:.46;pointer-events:none}
.compass{left:70px;top:72px;width:180px;height:180px;border:3px solid #6d4a2e;border-radius:50%;display:grid;place-items:center;font-size:82px;transform:rotate(-12deg)}
.mapTitle{right:70px;top:75px;font-size:26px;letter-spacing:.15em}
.routeSvg{position:absolute;inset:0;width:1600px;height:900px;pointer-events:none}
.route{stroke:#705438;stroke-width:4;stroke-dasharray:12 13;opacity:.36}
.route.hot{stroke:#f2cb72;opacity:.9}
#map{position:absolute;inset:0}
.tile,.base{position:absolute;transform:translate(-50%,-50%);touch-action:none}
.tile{width:72px;height:60px;border-radius:50% 46% 52% 48%;border:2px solid #eadcb8;background:radial-gradient(circle at 55% 35%,#b9b16a 0 20%,#7f873f 21% 42%,#b69a5e 43% 65%,#6d5939 66%);box-shadow:0 0 0 6px var(--owner),0 5px 9px #2d180b66;display:grid;place-items:center}
.tile:before{content:"🏝";font-size:31px;filter:saturate(.8)}
.tile.l2{width:80px;height:68px}.tile.l2:before{font-size:35px}
.tile.l3{width:91px;height:78px}.tile.l3:before{font-size:40px}
.islandNo{position:absolute;left:50%;bottom:-13px;transform:translateX(-50%);background:#312111dd;color:#f8e8c4;padding:1px 5px;border-radius:8px;border:1px solid #c8a967;font:700 10px system-ui,sans-serif;white-space:nowrap}
.tile.legal,.base.legal{outline:4px solid #f6d778;outline-offset:8px}
.tile.movable{outline:2px dashed #fff1c5;outline-offset:6px}
.ship{position:absolute;left:50%;top:-30px;transform:translateX(-50%);font-size:28px;filter:drop-shadow(0 3px 2px #0009);z-index:4}
.enemyShip{font-size:24px}
.base{width:108px;height:82px;border-radius:18px;background:linear-gradient(#55412d,#2b2118);border:3px solid var(--baseColor);box-shadow:0 0 0 6px var(--baseColor),0 7px 14px #1c0f08aa;color:#fff;text-shadow:0 2px #000;display:flex;flex-direction:column;align-items:center;justify-content:center;font:800 12px system-ui,sans-serif;z-index:3}
.hud{position:absolute;z-index:20;pointer-events:none}.hud>*{pointer-events:auto}
.topHud{left:0;right:0;top:max(8px,env(safe-area-inset-top));display:flex;justify-content:space-between;padding:0 18px}
.hudCluster{display:flex;gap:8px}
.parchmentChip{height:52px;min-width:100px;padding:6px 11px;border-radius:11px;border:1px solid #87683d;background:linear-gradient(#f1dfb7,#d6b377);box-shadow:0 3px 8px #1a0c06a6;color:#2d1e11;display:flex;align-items:center;gap:8px;font:800 14px system-ui,sans-serif}
.resourceIcon{width:34px;height:34px;border-radius:50%;display:grid;place-items:center;background:#865923;color:#fff;border:2px solid #edcd78}
.resourceText small{display:block;font-size:9px;text-transform:uppercase;letter-spacing:.08em;color:#6a5233}.resourceText b{font-size:19px}
.roundCard{position:absolute;left:50%;top:0;transform:translateX(-50%);width:245px;text-align:center;padding:5px 14px 7px;border-radius:0 0 15px 15px;border:1px solid #826138;background:linear-gradient(#f4e1b8,#dab77a);box-shadow:0 4px 10px #2a160aa0;font-family:system-ui,sans-serif}
.roundCard b{font-size:19px}.roundCard span{display:block;margin-top:2px;padding:2px 6px;border-radius:8px;background:#6f241d;color:#fff1d0;font-size:11px;font-weight:800}
.mapControls{position:absolute;left:max(10px,env(safe-area-inset-left));top:78px;z-index:25;display:flex;flex-direction:column;gap:6px}
.mapControl{width:42px;height:42px;border-radius:50%;border:1px solid #785a34;background:#d8b879ee;color:#352311;box-shadow:0 2px 6px #1b0d06a6;font-weight:900;font-size:20px}
.bottomHud{left:0;right:0;bottom:max(8px,env(safe-area-inset-bottom));display:flex;align-items:flex-end;justify-content:space-between;padding:0 16px}
.boostBtn{width:60px;height:50px;border-radius:13px;border:1px solid #76562e;background:linear-gradient(#e8ce95,#bd9152);box-shadow:0 3px 8px #1d0e07a8;color:#332313;font-size:22px;font-weight:900;position:relative}.boostBtn small{position:absolute;right:5px;bottom:3px;background:#2c1e12;color:#f5e5bc;border-radius:8px;padding:1px 5px;font-size:10px}.boostBtn.on{outline:3px solid #f4d166}
.actionArea{display:flex;gap:8px;align-items:flex-end}
.actionBtn{min-width:132px;height:60px;border-radius:31px;border:4px solid #d1a54d;background:radial-gradient(circle at 45% 35%,#b83a31,#761e18 67%,#46100d);color:#fff1cf;text-shadow:0 2px #45110c;box-shadow:0 4px 11px #180b06c9;font-weight:900;font-size:18px}.actionBtn:disabled{opacity:.55;filter:grayscale(.8)}
.secondaryBtn{height:48px;padding:0 13px;border-radius:12px;border:1px solid #76572f;background:linear-gradient(#ecd6a3,#c79c5c);color:#332313;font-weight:800}.secondaryBtn:disabled{opacity:.4}
.turnBoard{position:absolute;z-index:23;left:50%;bottom:max(8px,env(safe-area-inset-bottom));transform:translateX(-50%);height:57px;min-width:390px;max-width:55vw;padding:7px 12px 5px;border-radius:13px;border:1px solid #755831;background:linear-gradient(#edd7a5ee,#c99f61ee);box-shadow:0 3px 9px #170c06a8;font-family:system-ui,sans-serif}
.turnCaption{text-align:center;font-size:9px;text-transform:uppercase;letter-spacing:.12em;color:#604727;font-weight:900;margin-bottom:4px}
.timeline{display:grid;grid-template-columns:repeat(8,1fr);gap:7px;align-items:end}
.roundTrack{position:relative;display:grid;grid-template-columns:repeat(4,1fr);gap:2px;padding-top:9px}
.roundTrack:before{content:attr(data-round);position:absolute;top:-2px;left:50%;transform:translateX(-50%);font-size:8px;color:#755d3e}
.turnMark{height:7px;border-radius:5px;background:var(--mark);box-shadow:inset 0 0 0 1px #3a291977}
.turnMark.done{opacity:.25}.turnMark.current{height:10px;outline:2px solid #fff0b7;box-shadow:0 0 8px #fff0b7}
.shipPanel{position:absolute;z-index:30;right:18px;top:72px;width:250px;padding:10px;border-radius:14px;border:1px solid #73542e;background:linear-gradient(#f1ddb2,#cfaa6c);box-shadow:0 8px 24px #160a05b8;font-family:system-ui,sans-serif;display:none}.shipPanel.show{display:block}.shipPanel h3{margin:0 0 7px}.shipStats{font-size:12px;margin-bottom:8px}.shipUpgradeRow{display:flex;gap:7px}.miniBuy{flex:1;min-height:39px;border-radius:9px;background:#51301c;color:#f9ebca;border:1px solid #a67d45;font-size:12px;font-weight:800}.miniBuy:disabled{opacity:.4}
#log,#basesInfo,#orderInfo{display:none}
.overlay{position:absolute;inset:0;background:#160e08b9;display:none;place-items:center;z-index:60;padding:26px}.overlay.show{display:grid}
.sheet{width:min(900px,88vw);max-height:82vh;overflow:auto;background:linear-gradient(#f5e7c5,#d9bc83);border:3px solid #795833;border-radius:20px;padding:18px 20px;color:#2b1d11;font-family:system-ui,sans-serif;box-shadow:0 18px 60px #0009}
.sheet h2{margin:6px 0 14px;font-family:Georgia,serif;font-size:24px}.subtle{color:#6d5538;font-size:12px;font-weight:700}
.answers{display:grid;grid-template-columns:1fr 1fr;gap:10px}.answer{min-height:54px;border-radius:12px;background:#3f2a1b;color:#fff0cf;border:2px solid #9b7542;padding:11px 13px;text-align:left;font-weight:700}
.numrow{display:flex;gap:8px}.numrow input{flex:1;padding:12px;border-radius:10px;border:1px solid #9b7b49;background:#fff9e8;color:#25180d;font-size:18px}.btn.gold{background:#704518;color:#fff0ca;border-radius:10px;padding:10px 16px}
@media(max-height:520px){.parchmentChip{height:45px;min-width:88px;padding:4px 8px}.resourceIcon{width:31px;height:31px}.roundCard{width:210px}.turnBoard{height:50px}.actionBtn{height:54px;min-width:116px}.mapControls{top:68px}}
</style>
</head>
<body>
<main id="app">
<div id="mapViewport" class="mapViewport"><div id="mapScene" class="mapScene">
<div class="mapDecor compass">✥</div><div class="mapDecor mapTitle">ARCHIPELAGO</div>
<svg id="routeSvg" class="routeSvg" viewBox="0 0 1600 900"></svg>
<div id="map"></div>
<button class="base" data-base="A"></button><button class="base" data-base="B"></button><button class="base" data-base="C"></button><button class="base" data-base="D"></button>
</div></div>
<div class="hud topHud">
<div class="hudCluster"><div class="parchmentChip"><span class="resourceIcon">🪙</span><span class="resourceText"><small>Дублоны</small><b id="coinsV">20</b></span></div></div>
<div class="roundCard"><b id="roundV">Раунд 1/8</b><span id="status">Твой ход</span></div>
<div class="hudCluster"><div class="parchmentChip"><span class="resourceIcon">★</span><span class="resourceText"><small>Слава</small><b id="fameV">0</b></span></div>
<button id="shipPanelBtn" class="parchmentChip"><span class="resourceIcon">🚢</span><span class="resourceText"><small>Флагман</small><b id="shipV">3/3 · 1</b></span></button></div></div>
<div class="mapControls"><button id="zoomInBtn" class="mapControl">+</button><button id="zoomOutBtn" class="mapControl">−</button><button id="resetMapBtn" class="mapControl">◎</button><button id="newBtn" class="mapControl">↻</button></div>
<div id="shipPanel" class="shipPanel"><h3>Флагман</h3><div id="shipStats" class="shipStats"></div><div class="shipUpgradeRow"><button id="hpBtn" class="miniBuy">+ HP · 20</button><button id="dmgBtn" class="miniBuy">+ Урон · 30</button></div><div class="shipUpgradeRow" style="margin-top:7px"><button id="slotBtn" class="miniBuy">+ Слот · 30</button><button id="crewBtn" class="miniBuy">Экипаж</button></div></div>
<div class="hud bottomHud"><button id="secretBtn" class="boostBtn">🗺<small>×1</small></button><div class="actionArea"><button id="homeBtn" class="secondaryBtn">🚢 На базу</button><button id="modeBtn" class="actionBtn">⚔ Атака</button></div></div>
<div class="turnBoard"><div class="turnCaption">Порядок ходов · 8 раундов</div><div id="turnTimeline" class="timeline"></div></div>
<div id="log"></div><div id="basesInfo"></div><div id="orderInfo"></div>
</main>
<div id="questionOverlay" class="overlay"><section class="sheet"><div id="battleMeta" class="subtle"></div><h2 id="qText"></h2><div id="answers" class="answers"></div><div id="numericBox" style="display:none"><p id="nText"></p><div class="numrow"><input id="nInput" type="number" step="1" inputmode="numeric"><button id="nSend" class="btn gold">Ответить</button></div></div><div id="battleResult"></div></section></div>
<script type="module" src="runtime_v0_4.js"></script>
</body></html>
