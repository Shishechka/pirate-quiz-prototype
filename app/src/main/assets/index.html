<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<title>Pirates — No Flagship Lab</title>
<style>
:root{--r:#e24a42;--b:#3d80e7;--g:#3aaa68;--p:#9b57d3}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#241307;font-family:Georgia,"Times New Roman",serif}
button,input{font:inherit}
#app{position:relative;width:100%;height:100%;overflow:hidden;background:#2b190e}
.mapViewport{position:absolute;inset:0;overflow:hidden;touch-action:none;user-select:none}
.mapScene{position:absolute;left:0;top:0;width:1600px;height:900px;transform-origin:0 0}
.routeSvg{position:absolute;inset:0;width:1600px;height:900px;pointer-events:none}
#map{position:absolute;inset:0}
.tile,.base{position:absolute;transform:translate(-50%,-50%);touch-action:none}
.hud{position:absolute;z-index:30;pointer-events:none}.hud>*{pointer-events:auto}
.topHud{left:0;right:0;top:max(8px,env(safe-area-inset-top));display:flex;justify-content:space-between;padding:0 20px}
.parchmentChip{height:52px;min-width:118px;padding:6px 12px;border-radius:12px;border:1px solid #87683d;background:linear-gradient(#f1dfb7,#d6b377);box-shadow:0 3px 8px #1a0c06a6;color:#2d1e11;display:flex;align-items:center;gap:9px;font:800 14px system-ui,sans-serif}
.resourceIcon{width:35px;height:35px;border-radius:50%;display:grid;place-items:center;background:#865923;color:#fff;border:2px solid #edcd78}
.resourceText small{display:block;font-size:9px;text-transform:uppercase;letter-spacing:.08em;color:#6a5233}.resourceText b{font-size:20px}
.roundCard{position:absolute;left:50%;top:0;transform:translateX(-50%);width:285px;text-align:center;padding:6px 15px 8px;border-radius:0 0 16px 16px;border:1px solid #826138;background:linear-gradient(#f4e1b8,#dab77a);box-shadow:0 4px 10px #2a160aa0;font-family:system-ui,sans-serif}
.roundCard b{font-size:20px}.roundCard span{display:block;margin-top:3px;padding:3px 7px;border-radius:8px;background:#6f241d;color:#fff1d0;font-size:11px;font-weight:800;line-height:1.2}
.rightRail{position:absolute;z-index:31;right:18px;top:88px;bottom:18px;width:190px;display:flex;flex-direction:column;gap:12px;pointer-events:none}
.turnBoard{pointer-events:none;padding:11px;border-radius:15px;border:1px solid #755831;background:linear-gradient(#edd7a5ee,#c99f61ee);box-shadow:0 4px 12px #170c06a8;font-family:system-ui,sans-serif}
.turnCaption{font-size:10px;text-transform:uppercase;letter-spacing:.08em;color:#604727;font-weight:900;margin:0 0 8px}
.timeline{display:flex;flex-direction:column;gap:6px}
.turnRow{height:30px;display:grid;grid-template-columns:16px 1fr 18px;align-items:center;gap:7px;padding:0 7px;border-radius:8px;background:rgba(255,245,216,.28);font:800 10px system-ui,sans-serif;color:#3b2918}
.turnRow.done{opacity:.4}.turnRow.current{background:rgba(111,36,29,.92);color:#fff1d0;box-shadow:0 0 0 2px rgba(255,235,178,.72)}
.turnDot{width:11px;height:11px;border-radius:50%;background:var(--turn-color);box-shadow:0 0 0 1px rgba(46,28,15,.45)}.turnStep{text-align:right;font-size:9px;opacity:.7}
.boostStack{margin-top:auto;display:flex;justify-content:flex-end;pointer-events:auto}
.boostBtn{width:58px;height:56px;border-radius:13px;border:1px solid #76562e;background:linear-gradient(#e8ce95,#bd9152);box-shadow:0 3px 8px #1d0e07a8;color:#332313;font-size:23px;font-weight:900;position:relative}.boostBtn small{position:absolute;right:5px;bottom:3px;background:#2c1e12;color:#f5e5bc;border-radius:8px;padding:1px 5px;font-size:10px}.boostBtn.on{outline:3px solid #f4d166}
.actionBtn{pointer-events:auto;width:190px;height:64px;border-radius:32px;border:4px solid #d1a54d;background:radial-gradient(circle at 45% 35%,#b83a31,#761e18 67%,#46100d);color:#fff1cf;text-shadow:0 2px #45110c;box-shadow:0 4px 11px #180b06c9;font-weight:900;font-size:18px}.actionBtn:disabled{opacity:.5;filter:grayscale(.7)}
.overlay{position:absolute;inset:0;background:#160e08c7;display:none;place-items:center;z-index:70;padding:26px}.overlay.show{display:grid}
.sheet{width:min(820px,88vw);max-height:84vh;overflow:auto;background:linear-gradient(#f5e7c5,#d9bc83);border:3px solid #795833;border-radius:20px;padding:20px;color:#2b1d11;font-family:system-ui,sans-serif;box-shadow:0 18px 60px #0009}
.questionSheet{position:relative;padding-top:30px;overflow:hidden}
#questionTimerTrack{position:absolute;left:0;right:0;top:0;height:9px;background:rgba(67,45,25,.22);overflow:hidden}
#questionTimerFill{width:100%;height:100%;transform:scaleX(1);transform-origin:left center;background:linear-gradient(90deg,#d9ad4f,#8e2b22);will-change:transform}
.battleMeta{display:flex;align-items:center;justify-content:center;gap:8px;flex-wrap:wrap;margin-bottom:10px;font-weight:900;font-size:13px}
.playerBadge{display:inline-flex;align-items:center;gap:6px;padding:5px 9px;border-radius:10px;background:#fff7ddaa;border:1px solid #9d7748}.playerBadge i{width:10px;height:10px;border-radius:50%;background:var(--badge)}
.attackArrow{font-size:18px;color:#6f241d}.targetBadge{padding:5px 9px;border-radius:10px;background:#6f241d;color:#fff1d0}
.sheet h2{margin:7px 0 15px;font-family:Georgia,serif;font-size:24px;text-align:center}
.answers{display:grid;grid-template-columns:1fr 1fr;gap:10px}.answer{--attacker-fill:#3f2a1b;--defender-fill:#3f2a1b;min-height:55px;border-radius:12px;background:linear-gradient(90deg,var(--attacker-fill) 0 50%,var(--defender-fill) 50% 100%);color:#fff0cf;border:2px solid #9b7542;padding:11px 13px;text-align:left;font-weight:800;text-shadow:0 1px 2px #201006;transition:background .18s,box-shadow .18s,outline-color .18s}.answer:disabled{opacity:1}.answer.correctReveal{outline:3px solid #62e66d;outline-offset:2px;box-shadow:0 0 16px rgba(78,255,104,.9),inset 0 0 0 1px rgba(205,255,211,.8)}
.numericBox{display:none}.numrow{display:flex;gap:8px}.numrow input{flex:1;padding:12px;border-radius:10px;border:1px solid #9b7b49;background:#fff9e8;color:#25180d;font-size:18px}.btn.gold{background:#704518;color:#fff0ca;border-radius:10px;padding:10px 16px}
#battleResult{min-height:24px;margin-top:12px;text-align:center;font-size:13px;font-weight:800;color:#5a4025}
.finalTable{width:100%;border-collapse:collapse}.finalTable th,.finalTable td{padding:8px;border-bottom:1px solid #8c6b3e55;text-align:center}.finalActions{display:flex;justify-content:center;margin-top:14px}.finalActions button{padding:10px 18px;border-radius:10px;background:#704518;color:#fff0ca;border:0;font-weight:900}
@media(max-height:620px){.parchmentChip{height:45px;min-width:100px}.resourceIcon{width:30px;height:30px}.roundCard{width:250px}.rightRail{top:72px;right:12px;bottom:12px;width:166px;gap:8px}.turnBoard{padding:8px}.turnRow{height:24px}.actionBtn{width:166px;height:55px;font-size:16px}.boostBtn{width:50px;height:48px}.sheet{max-height:90vh}}
</style>
</head>
<body>
<main id="app">
  <div id="mapViewport" class="mapViewport">
    <div id="mapScene" class="mapScene">
      <svg id="routeSvg" class="routeSvg" viewBox="0 0 1600 900"></svg>
      <div id="map"></div>
      <button class="base" data-base="A"></button>
      <button class="base" data-base="B"></button>
      <button class="base" data-base="C"></button>
      <button class="base" data-base="D"></button>
    </div>
  </div>
  <div class="hud topHud">
    <div class="parchmentChip"><span class="resourceIcon">🪙</span><span class="resourceText"><small>Дублоны</small><b id="coinsV">20</b></span></div>
    <div class="roundCard"><b id="roundV">Освоение 1/6</b><span id="status">Подготовка карты…</span></div>
    <div class="parchmentChip"><span class="resourceIcon">★</span><span class="resourceText"><small>Слава</small><b id="fameV">0</b></span></div>
  </div>
  <aside class="rightRail">
    <div class="turnBoard"><div id="turnCaption" class="turnCaption">Порядок освоения</div><div id="turnTimeline" class="timeline"></div></div>
    <div class="boostStack"><button id="secretBtn" class="boostBtn" aria-label="Тайный путь">🗺<small>×1</small></button></div>
    <button id="actionBtn" class="actionBtn" disabled>Выбери остров</button>
  </aside>
  <div id="log" hidden></div>
</main>
<div id="questionOverlay" class="overlay">
  <section class="sheet questionSheet">
    <div id="questionTimerTrack"><div id="questionTimerFill"></div></div>
    <div id="battleMeta" class="battleMeta"></div>
    <h2 id="qText"></h2>
    <div id="answers" class="answers"></div>
    <div id="numericBox" class="numericBox">
      <div class="numrow"><input id="nInput" type="number" inputmode="decimal" autocomplete="off"><button id="nSend" class="btn gold">Ответить</button></div>
    </div>
    <div id="battleResult"></div>
  </section>
</div>
<div id="finalOverlay" class="overlay">
  <section class="sheet">
    <h2>Итоги партии</h2>
    <div id="finalBody"></div>
    <div class="finalActions"><button id="newBtn">Новая партия</button></div>
  </section>
</div>
<script src="no_flagship_game.js"></script>
<script src="v1_1_visual_patch.js"></script>
<script src="no_flagship_ui.js"></script>
</body>
</html>
